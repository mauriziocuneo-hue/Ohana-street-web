name: OHANA V3 — Aggiorna catalogo verificato
# Scarica fotografie solo dal proxy OHANA, mai dagli URL privati dei fornitori.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_v3_public.py'
      - '.github/workflows/v3-publish.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: ohana-v3-static-publish
  cancel-in-progress: false

jobs:
  sync-public:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read sanitized published V3 products
        run: python3 scripts/sync_v3_public.py
      - name: Install free/open-source image conversion tool
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Download and strip metadata from anonymized images
        run: .venv/bin/python scripts/mirror_v3_photos.py --limit 900 --workers 16
      - name: Prefer local WebP copies when complete
        run: python3 scripts/sync_v3_public.py
      - name: Validate public V3 data and photos
        run: node tests/v3-catalog.test.mjs
      - name: Publish changed photos and catalog JSON
        id: publish
        run: |
          git add data/catalogo-v3.json assets/v3/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mirror approved OHANA V3 photographs as lightweight WebP"
            git push || (git pull --rebase origin main && git push)
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No new V3 photo files or catalog changes."
          fi
      - name: Deploy updated photographs on GitHub Pages
        if: steps.publish.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
