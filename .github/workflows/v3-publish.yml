name: OHANA V3 — Aggiorna catalogo verificato

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_v3_public.py'
      - '.github/workflows/v3-publish.yml'

permissions:
  contents: write

concurrency:
  group: ohana-v3-static-publish
  cancel-in-progress: false

jobs:
  sync-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read sanitized published V3 products
        run: python3 scripts/sync_v3_public.py
      - name: Publish changed JSON if needed
        run: |
          if ! git diff --quiet -- data/catalogo-v3.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalogo-v3.json
            git commit -m "Update approved OHANA V3 product catalog"
            git push
          else
            echo "No new verified products."
          fi
