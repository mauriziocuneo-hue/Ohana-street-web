name: OHANA STREET — Verifica e pubblica su Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "verifica-responsive.html"
      - "catalogo.json"
      - "catalogo-nuovo.html"
      - "catalogo-nuovo.json"
      - "scripts/audit_catalogo_nuovo.py"
      - "tests/catalogo-nuovo.test.js"
      - "foto-extra.json"
      - "tests/media-bot.test.js"
      - "modelli.html"
      - "modelli.json"
      - "favicon.svg"
      - "assets/**"
      - "scripts/audit_catalog.py"
      - "gestione/**"
      - "tools/prepara_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    name: Verifica catalogo, fotografie e assenza link riservati
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlla tutte le gallerie fotografiche
        run: python3 scripts/audit_catalog.py
      - name: Verifica risposte del bot fotografico
        run: node tests/media-bot.test.js
      - name: Verifica il nuovo catalogo e le varianti
        run: node tests/catalogo-nuovo.test.js
      - name: Prepara i soli file pubblici
        run: python3 tools/prepara_pages.py
      - name: Carica archivio validato
        uses: actions/upload-artifact@v4
        with:
          name: ohana-sito-pubblico
          retention-days: 1
          path: _site/
          include-hidden-files: true

  deploy:
    name: Pubblica su GitHub Pages
    needs: verifica
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepara file pubblici
        run: python3 tools/prepara_pages.py
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Carica il sito Pages
        uses: actions/upload-pages-artifact@v4
        with:
          retention-days: 1
          path: _site/
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4

