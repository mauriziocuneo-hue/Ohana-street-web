name: OHANA - Pubblica lotto 002 con 250 nuovi prodotti

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/importa-lotto-002.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ohana-import-002
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    env:
      OHANA_PUBLIC_ZIP_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-936c-81f4-8c6a-2e040d28866a/raw?se=2026-10-20T19%3A06%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=af35c78f-e863-5c35-a295-b432fae3038f&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T23%3A06%3A12Z&ske=2026-10-20T23%3A06%3A12Z&sks=b&skv=2026-02-06&sig=EN0T%2BJAvzRNx%2BADILbfUazHeK7R2ye72tfqOG7R9Sac%3D"
      OHANA_PUBLIC_ZIP_SHA256: "363c3116a04b0ccf1c4de85d8cd43d24af4d5e3ee20f841865585529c1adb164"
      OHANA_NEW_PRODUCT_COUNT: "250"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Verifica il lotto WEBP e aggiungi solo prodotti nuovi
        run: python tools/importa_lotto_webp.py
      - name: Verifica tutte le fotografie e nessun riferimento riservato
        run: python tools/prepara_pages.py
      - name: Salva immagini e catalogo nel repository pubblico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json assets/products/
          if git diff --cached --quiet; then
            echo "No new products"
          else
            git commit -m "Aggiungi lotto 002: 250 foto WebP e schede OHANA"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
      - uses: actions/deploy-pages@v4
