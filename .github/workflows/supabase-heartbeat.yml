name: OHANA Supabase heartbeat

on:
  schedule:
    # UTC, fuori dalle ore di punta; 3 query minime al giorno.
    - cron: '17 5 * * *'
    - cron: '23 13 * * *'
    - cron: '41 21 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/supabase-heartbeat.yml'
      - 'scripts/check_supabase_alive.py'
      - 'gestione/config.js'

permissions:
  contents: read

concurrency:
  group: ohana-supabase-heartbeat
  cancel-in-progress: false

jobs:
  check-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Execute minimal PostgreSQL query via Supabase REST
        run: python3 scripts/check_supabase_alive.py
