name: OHANA - Importa 100 schede e pubblica GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/importa-lotto-001.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ohana-import-pilot
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    env:
      OHANA_PUBLIC_ZIP_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-bb68-81f4-b6c7-63e0e96e0238/raw?se=2026-10-20T18%3A57%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=c78387d2-f976-5801-a731-c72f1f863c0c&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T06%3A14%3A50Z&ske=2026-10-21T06%3A14%3A50Z&sks=b&skv=2026-02-06&sig=a%2B6mysNGTNao9GEsRmhZHORPvmBSHJG9JhePOCTd8LQ%3D"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa libreria HTTPS
        run: pip install requests
      - name: Verifica ZIP pubblico e importa 100 immagini WebP
        run: python tools/importa_pilota_pubblico.py
      - name: Verifica integrita e assenza dati riservati
        run: python tools/prepara_pages.py
      - name: Salva immagini e catalogo pubblici nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json assets/products
          if git diff --cached --quiet; then
            echo "No new records; the pilot is already imported"
          else
            git commit -m "Aggiungi lotto pilota OHANA: 100 foto WebP e schede"
            git push
          fi
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carica sito completo validato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
      - name: Pubblica sito aggiornato
        uses: actions/deploy-pages@v4
