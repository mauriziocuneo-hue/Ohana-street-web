name: Richieste e ordini - demo isolata
on:
  push:
    branches: [test/gestione-richieste-pagamenti]
    paths: ['gestione/**', 'tests/ordini-demo.test.mjs', 'tests/importa-whatsapp.test.mjs', 'tests/gestori-link.test.js', 'tools/build_orders_demo.py', '.github/workflows/ordini-demo.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ordini-demo.test.mjs tests/importa-whatsapp.test.mjs
      - run: node tests/gestori-link.test.js
      - run: python3 tools/build_orders_demo.py "$RUNNER_TEMP/ohana-demo"
