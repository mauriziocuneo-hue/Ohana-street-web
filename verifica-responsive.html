<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OHANA — Verifica responsive</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#e9f1ed;color:#123e40;font:14px Arial}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}button,select{padding:12px;border:1px solid #123e40;background:white;border-radius:8px;font:inherit}button{cursor:pointer}#stage{overflow:auto;padding:12px;background:#cfddd7}iframe{display:block;background:white;border:0;margin:auto;box-shadow:0 0 0 2px #123e40}pre{white-space:pre-wrap;background:white;padding:14px;line-height:1.5}h1{font-size:20px;margin:0 12px 0 0}</style><header><h1>OHANA · Verifica responsive</h1><select id="page" aria-label="Pagina"><option value="index.html?qa=20261022-4">Catalogo</option><option value="modelli.html?qa=20261022-4">Indice famiglie</option><option value="gestione/?qa=20261022-4">Accesso gestori</option></select><select id="size" aria-label="Dimensioni"><option value="360,800">Smartphone 360 × 800</option><option value="390,844" selected>Smartphone 390 × 844</option><option value="768,1024">Tablet 768 × 1024</option><option value="1024,768">Tablet 1024 × 768</option><option value="1280,900">Desktop 1280 × 900</option></select><button id="check">Controlla layout</button><a href="index.html">Torna al sito</a></header><pre id="result" aria-live="polite">Caricamento…</pre><div id="stage"><iframe id="preview" title="Anteprima del sito" src="index.html?qa=20261022-4" width="390" height="844"></iframe></div><script>
const frame=document.querySelector('#preview'),result=document.querySelector('#result');
function resize(){const [w,h]=document.querySelector('#size').value.split(',').map(Number);frame.width=w;frame.height=h;}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;const visible=e=>e.getClientRects().length&&w.getComputedStyle(e).visibility!=='hidden';const root=d.documentElement;const modal=d.querySelector('#overlay:not(.hide)');const rect=modal?.querySelector('.dialog')?.getBoundingClientRect();const nav=d.querySelector('.nav'),menu=d.querySelector('#menuBtn');const images=[...d.querySelectorAll('img')].filter(visible);result.textContent=JSON.stringify({page:frame.getAttribute('src'),viewport:[w.innerWidth,w.innerHeight],documentWidth:root.scrollWidth,horizontalOverflow:root.scrollWidth>root.clientWidth+1,desktopNavigation:nav?visible(nav):null,mobileMenu:menu?visible(menu):null,results:d.querySelector('#results')?.textContent||d.querySelector('#count')?.textContent||'',dialog:rect?{width:Math.round(rect.width),height:Math.round(rect.height),insideViewport:rect.left>=0&&rect.right<=w.innerWidth&&rect.top>=0&&rect.bottom<=w.innerHeight+1,whatsappLinks:modal.querySelectorAll('a[href*="wa.me"]').length}:null,loadedImages:images.filter(e=>e.complete&&e.naturalWidth>0).length,failedImages:images.filter(e=>e.complete&&!e.naturalWidth).map(e=>e.getAttribute('src')),photoContain:images.every(e=>w.getComputedStyle(e).objectFit==='contain')},null,2);}
document.querySelector('#size').addEventListener('change',()=>{resize();requestAnimationFrame(()=>requestAnimationFrame(inspect));});document.querySelector('#page').addEventListener('change',e=>{frame.src=e.target.value;});document.querySelector('#check').addEventListener('click',inspect);frame.addEventListener('load',inspect);resize();
</script></html>
